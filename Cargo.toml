[package]
name = "akhet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Durable MQTT and Modbus TCP collection with a local SQLite spool and HTTP replay (example infrastructure)"
publish = false

[dependencies]
base64 = "0.23.1"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "signal", "sync"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rumqttd = { version = "0.20", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-server"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
