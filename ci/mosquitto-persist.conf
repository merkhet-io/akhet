# Mosquitto 2 for tests/mqtt_broker_restart.rs: loopback, anonymous, test only.
# Persistent sessions survive restarts; state is saved on clean shutdown
# and every second (autosave_interval), so a SIGKILL loses at most ~1 s.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
max_queued_messages 10000
max_inflight_messages 20
